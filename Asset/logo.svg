    <path d="M 468,-110 H 515 C 532,-110 543,-101 543,-88 C 543,-78 536,-71 525,-67 C 538,-63 546,-54 546,-40 C 546,-24 532,-110 514,0 H 468 Z M 490,-91 V -67 H 512 C 518,-67 522,-71 522,-79 C 522,-86 518,-91 512,-91 Z M 490,-49 V -20 H 514 C 522,-20 525,-25 525,-34 C 525,-43 522,-49 514,-49 Z" />
