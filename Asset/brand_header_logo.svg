<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%" height="100%">
  <!-- Emblem Group -->
  <g transform="translate(15, 10)">
    <!-- Outer Circle Ring with Gap -->
    <path d="M 155,160 A 85,85 0 1,0 185,110" fill="none" stroke="#0F172A" stroke-width="15" stroke-linecap="round" />
    
    <!-- Stylized Letter 'A' -->
    <path d="M 105,30 L 55,150 L 77,150 L 105,80 L 130,138 L 90,138 L 80,155 L 140,155 L 155,150 L 180,150 Z" fill="#0F172A" />
    <!-- Right leg extension -->
    <path d="M 120,115 L 170,185 L 187,185 L 135,115 Z" fill="#0F172A" />
    
    <!-- Red Leaf Accent on A -->
    <path d="M 55,150 C 62,130 92,125 104,130 C 88,145 72,153 55,150 Z" fill="#E11C2A" />
  </g>

  <!-- High-Impact Brand Typography Group -->
  <g transform="translate(220, 115)">
    <!-- ALPHABET Title -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="92" letter-spacing="6" fill="#0F172A">ALPHABET</text>
    
    <!-- Red leaf accent on second A of ALPHABET -->
    <path d="M 430,-48 C 438,-35 455,-35 465,-40 C 452,-25 438,-25 430,-48 Z" fill="#E11C2A" />

    <!-- Thin Divider Line -->
    <line x1="2" y1="22" x2="685" y2="22" stroke="#0F172A" stroke-width="4" />

    <!-- CORPORATION Sub-Title -->
    <text x="342" y="78" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="22" fill="#0F172A" text-anchor="middle">CORPORATION</text>
  </g>
</svg>
